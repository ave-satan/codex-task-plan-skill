<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --text: light-dark(#17181a, #f1f3f5);
        --muted: light-dark(#6b7078, #aeb3bb);
        --border: light-dark(#e1e4e8, #3a3d42);
        --pending: #8a9099;
        --running: #4f8cff;
        --done: #31a56b;
        --blocked: #e0565b;
        --question: #d98d2b;
        --skipped: #b07a35;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 5px 0; background: transparent; color: var(--text); }
      .shell {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: transparent;
        overflow: visible;
        opacity: 0;
        visibility: hidden;
      }
      .shell.ready {
        opacity: 1;
        visibility: visible;
        animation: appear 160ms ease-out;
      }
      .header {
        width: calc(100% + 24px); display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 7px;
        min-height: 18px; margin: -10px -12px 8px; padding: 12px;
        background: light-dark(rgb(0 0 0 / .025), rgb(255 255 255 / .035));
        border-bottom: 1px solid var(--border); border-radius: 11px 11px 0 0;
      }
      .plan-icon { display: inline-flex; width: 18px; height: 18px; align-items: center; justify-content: center; color: var(--running); font-size: 13px; line-height: 1; }
      .title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
      .summary { flex: none; font-size: 11px; color: var(--muted); }
      .body { display: block; width: 100%; padding: 0; }
      .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
      .step { display: grid; width: 100%; min-height: 28px; grid-template-columns: 18px minmax(0, 1fr); align-items: start; column-gap: 7px; padding: 5px 0; background: transparent; }
      .status { width: 18px; text-align: center; font-size: 13px; line-height: 18px; color: var(--pending); }
      .in_progress .status { color: var(--running); }
      .status-gear { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; transform-origin: center; animation: gear-turn 7s linear infinite; }
      .goal-stopped .status-gear { animation-play-state: paused; }
      .completed .status { color: var(--done); }
      .waiting_for_user .status { color: var(--question); animation: question-breathe 2.8s ease-in-out infinite; transform-origin: center; }
      .blocked .status { color: var(--blocked); }
      .skipped .status { color: var(--skipped); }
      .step-title { font-size: 12px; line-height: 18px; }
      .step-head { display: grid; grid-template-columns: minmax(0, max-content) auto; align-items: center; width: fit-content; max-width: 100%; min-width: 0; column-gap: 6px; }
      .step-head .step-title, .step-head .progress { grid-column: 1; }
      .step-head .step-title { min-width: 0; grid-row: 1; }
      .step-head .progress { grid-row: 2; }
      .agents { display: inline-flex; align-items: center; align-self: center; grid-column: 2; grid-row: 1 / span 2; height: 24px; gap: 3px; margin-left: 2px; }
      .agent {
        display: inline-flex; align-items: center; justify-content: center;
        box-sizing: border-box; flex: 0 0 24px; width: 24px; height: 24px; margin: 0;
        border: 0; border-radius: 4px; line-height: 1;
        background: transparent; color: var(--running); cursor: help; position: relative;
      }
      .agent:first-child { margin-left: 0; }
      .agent svg { display: block; flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
      .agent img { display: block; flex: none; width: 24px; height: 24px; object-fit: contain; }
      .agent svg { width: 24px; height: 24px; }
      .in_progress .agent > img {
        animation: var(--agent-motion, none) var(--agent-period, 2.6s) ease-in-out infinite,
          agent-breathe 2.5s ease-in-out infinite;
        animation-delay: var(--agent-phase, 0s); transform-origin: 50% 65%;
      }
      .agent[data-category="research"] { --agent-motion: agent-research; }
      .agent[data-category="architecture"] { --agent-motion: agent-architecture; }
      .agent[data-category="design"] { --agent-motion: agent-design; }
      .agent[data-category="implementation"] { --agent-motion: agent-implementation; }
      .agent[data-category="diagnostics"] { --agent-motion: agent-diagnostics; }
      .agent[data-category="testing"] { --agent-motion: agent-testing; }
      .agent[data-category="review"] { --agent-motion: agent-review; }
      .agent[data-category="documentation"] { --agent-motion: agent-documentation; }
      .agent[data-category="data"] { --agent-motion: agent-data; }
      .agent[data-category="operations"] { --agent-motion: agent-operations; }
      .in_progress .agent:hover > img, .in_progress .agent:focus-visible > img,
      .goal-stopped .in_progress .agent > img { animation-play-state: paused; }
      .in_progress .agent[data-status="completed"] > img { animation: none; opacity: 1; transform: none; }
      @keyframes agent-research { 0%, 33.846%, 100% { transform: rotate(0); } 7.692%, 23.077% { transform: rotate(-3deg); } 15.385%, 29.231% { transform: rotate(3deg); } }
      @keyframes agent-architecture { 0%, 36.923%, 100% { transform: rotate(0); } 12.308% { transform: rotate(-2deg); } 24.615% { transform: rotate(2deg); } }
      @keyframes agent-design { 0%, 46.154%, 100% { transform: rotate(0); } 23.077% { transform: rotate(-4deg); } }
      @keyframes agent-implementation { 0%, 15.385%, 30.769%, 100% { transform: translateY(0); } 7.692%, 23.077% { transform: translateY(-1px); } }
      @keyframes agent-diagnostics { 0%, 36.923%, 100% { transform: translateX(0); } 12.308% { transform: translateX(1px); } 24.615% { transform: translateX(-1px); } }
      @keyframes agent-testing { 0%, 27.692%, 100% { transform: rotate(0); } 12.308% { transform: rotate(4deg); } }
      @keyframes agent-review { 0%, 61.538%, 100% { transform: rotate(0); } 18.462% { transform: rotate(-3deg); } 43.077% { transform: rotate(3deg); } }
      @keyframes agent-documentation { 0%, 30.769%, 100% { transform: translateX(0) rotate(0); } 12.308% { transform: translateX(1px) rotate(5deg); } }
      @keyframes agent-data { 0%, 36.923%, 100% { transform: translateY(0); } 9.231% { transform: translateY(1px); } 18.462% { transform: translateY(-.5px); } 27.692% { transform: translateY(.5px); } }
      @keyframes agent-operations { 0%, 27.692%, 100% { transform: translateX(0) rotate(0); } 6.154% { transform: translateX(-1px) rotate(-2deg); } 12.308% { transform: translateX(1px) rotate(2deg); } 18.462% { transform: translateX(-.5px); } }
      .plan-icon img { display: block; width: 18px; height: 18px; object-fit: contain; }
      .agent-gear { transform-origin: 16px 16px; }
      .goal-stopped .agent-gear { animation-play-state: paused; }
      @keyframes gear-turn { to { transform: rotate(360deg); } }
      .agent::after {
        content: attr(data-tooltip); position: absolute; z-index: 20;
        left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 2px);
        padding: 4px 7px; border-radius: 6px;
        background: CanvasText; color: Canvas;
        font-size: 10px; font-weight: 500; line-height: 14px; white-space: nowrap;
        opacity: 0; visibility: hidden; pointer-events: none;
        transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 120ms;
      }
      .agent:hover::after, .agent:focus-visible::after {
        opacity: 1; visibility: visible; transform: translate(-50%, 0);
        transition-delay: 0s;
      }
      .completed .step-title, .skipped .step-title { color: var(--muted); }
      .completed .step-title { text-decoration: line-through; text-decoration-thickness: 1px; }
      .note { margin-top: 4px; font-size: 10px; line-height: 14px; color: var(--muted); }
      .progress { width: var(--progress-width, 100%); max-width: 100%; height: 3px; margin-top: 4px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--running) 15%, var(--border)); }
      .progress > span { display: block; position: relative; height: 100%; overflow: hidden; border-radius: inherit; background: var(--running); transition: width 380ms cubic-bezier(.22, .8, .3, 1); }
      .progress > span::after {
        content: ""; position: absolute; inset: 0; width: 38%;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / .28), transparent);
        transform: translateX(-160%); animation: progress-glint 2.4s ease-in-out infinite;
      }
      .progress.indeterminate > span { width: 32%; animation: activity 1.7s ease-in-out infinite; transition: none; }
      .progress.indeterminate > span::after { display: none; }
      @keyframes activity { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
      .footer { display: flex; min-height: 14px; align-items: flex-end; justify-content: flex-end; margin-top: 6px; font-size: 10px; line-height: 14px; color: var(--muted); }
      .complete .plan-icon { color: var(--done); }
      .cancelled .plan-icon { color: var(--blocked); }
      .goal-stopped .status, .goal-stopped .agent, .goal-stopped .progress > span::after { animation: none; }
      .goal-stopped .progress > span { transition: none; animation-play-state: paused; }
      @keyframes appear { from { opacity: 0; transform: translateY(3px); } }
      @keyframes pulse { 50% { opacity: .42; transform: scale(.82); } }
      @keyframes question-breathe { 0%, 100% { opacity: .82; transform: translateY(0) scale(1); } 50% { opacity: 1; transform: translateY(-.7px) scale(1.035); } }
      @keyframes agent-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      @keyframes progress-glint { 55%, 100% { transform: translateX(360%); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main id="shell" class="shell" aria-live="polite">
      <header class="header">
        <span class="plan-icon" aria-hidden="true"><img src="__PLAN_HEADER_ICON__" width="18" height="18" alt=""></span>
        <span id="title" class="title">План задачи</span>
        <span id="summary" class="summary">0/0</span>
      </header>
      <section class="body">
        <ol id="steps" class="steps"></ol>
        <div id="footer" class="footer"></div>
      </section>
    </main>
    <script>
      const categoryIcons = /*__WORK_CATEGORY_ICONS__*/ {};
      const labels = {
        pending: { icon: "○", text: "Ожидает" },
        in_progress: { icon: "◉", text: "В работе" },
        waiting_for_user: { icon: "?", text: "Нужен ответ" },
        completed: { icon: "✓", text: "Готово" },
        blocked: { icon: "!", text: "Заблокировано" },
        skipped: { icon: "–", text: "Пропущено" },
      };
      const shell = document.getElementById("shell");
      const title = document.getElementById("title");
      const summary = document.getElementById("summary");
      const steps = document.getElementById("steps");
      const footer = document.getElementById("footer");
      let planId = null;
      let lastRevision = null;
      let lastGoalKey = null;
      const previousProgress = new Map();

      const initialOutput = window.openai?.toolOutput;

      function extractPlan(value) {
        return value?.structuredContent?.plan ?? value?.plan ?? value?.mcpToolResult?.structuredContent?.plan ?? null;
      }

      let heightFramePending = false;
      let lastReportedHeight = null;
      function notifyHeight() {
        if (heightFramePending) return;
        heightFramePending = true;
        requestAnimationFrame(() => {
          heightFramePending = false;
          if (!shell.classList.contains("ready") || typeof window.openai?.notifyIntrinsicHeight !== "function") return;
          const bodyStyle = getComputedStyle(document.body);
          // Measure content, not the iframe viewport. offsetHeight ignores entrance transforms.
          const height = Math.ceil(shell.offsetHeight
            + (parseFloat(bodyStyle.paddingTop) || 0)
            + (parseFloat(bodyStyle.paddingBottom) || 0));
          if (height === lastReportedHeight) return;
          window.openai.notifyIntrinsicHeight(height);
          lastReportedHeight = height;
        });
      }

      function alignProgressBars() {
        for (const progress of steps.querySelectorAll(".progress")) {
          const step = progress.closest(".step");
          const stepTitle = step?.querySelector(".step-title");
          if (!stepTitle) continue;
          const textWidth = Math.ceil(stepTitle.getBoundingClientRect().width);
          progress.style.setProperty("--progress-width", `${textWidth}px`);
        }
      }

      function render(plan) {
        if (!plan || (lastRevision !== null && plan.revision < lastRevision)) return;
        const goalKey = JSON.stringify(plan.goal ?? null);
        if (plan.revision === lastRevision && goalKey === lastGoalKey) return;
        if (planId && plan.id !== planId) return;
        lastRevision = plan.revision;
        lastGoalKey = goalKey;
        planId = plan.id;
        title.textContent = plan.title;
        summary.textContent = `${plan.finished}/${plan.total}`;
        shell.classList.toggle("complete", plan.status === "completed");
        shell.classList.toggle("cancelled", plan.status === "cancelled");
        const goal = plan.goal;
        const goalStopped = goal?.state === "linked" && goal.status !== "active";
        shell.classList.toggle("goal-stopped", Boolean(goalStopped || goal?.availability === "unavailable"));
        steps.replaceChildren();
        const activeProgressIds = new Set();

        for (const item of plan.steps) {
          const meta = labels[item.status] ?? labels.pending;
          const li = document.createElement("li");
          li.className = `step ${item.status}`;

          const status = document.createElement("span");
          status.className = "status";
          const pausedStep = item.status === "in_progress"
            && goal?.state === "linked" && goal.status === "paused";
          status.textContent = pausedStep ? "⏸" : meta.icon;
          if (item.status === "in_progress" && !pausedStep) {
            status.innerHTML = '<svg class="status-gear" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" d="M10 2h4l.6 3 2 .9 2.6-1.5 2 3.4-2.2 2 .2 2.2 2.2 2-2 3.4-2.8-1-1.8 1.1-.6 3.5h-4l-.6-3.5-1.8-1.1-2.8 1-2-3.4 2.2-2 .2-2.2-2.2-2 2-3.4L7.4 6l2-.9Z"/><circle cx="12" cy="12" r="3.2"/></svg>';
          }
          status.setAttribute("aria-label", pausedStep ? "На паузе" : meta.text);

          const content = document.createElement("div");
          const head = document.createElement("div");
          head.className = "step-head";
          const stepTitle = document.createElement("div");
          stepTitle.className = "step-title";
          stepTitle.textContent = item.title;
          head.append(stepTitle);

          if (item.agents?.length) {
            const agentList = document.createElement("span");
            agentList.className = "agents";
            agentList.setAttribute("aria-label", `Субагенты: ${item.agents.map((agent) => agent.name).join(", ")}`);
            for (const itemAgent of item.agents) {
              const agent = document.createElement("span");
              agent.className = "agent";
              agent.dataset.status = itemAgent.status ?? "working";
              const categoryIcon = Object.hasOwn(categoryIcons, itemAgent.category) ? categoryIcons[itemAgent.category] : null;
              const displayName = itemAgent.name.replace(/^\/root\//, "");
              const agentLabel = `${categoryIcon?.label ?? "Субагент"} · ${displayName}`;
              agent.dataset.tooltip = agentLabel;
              // Stable identity offsets keep agents out of sync across renders.
              const motionSeed = Array.from(itemAgent.name).reduce((hash, char) => (hash * 31 + char.codePointAt(0)) >>> 0, 0);
              agent.style.setProperty("--agent-period", `${((5 + (motionSeed % 3001) / 1000) / 1.5) * 0.65}s`);
              agent.style.setProperty("--agent-phase", `-${(motionSeed % 5000) / 1000}s`);
              agent.tabIndex = 0;
              agent.setAttribute("aria-label", `Субагент: ${agentLabel}`);
              agent.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 18c-3 2-6 0-5-3-3-1-3-5 0-6-1-3 2-5 4-4 1-3 5-2 5 1 3-1 5 2 3 4M10 5v13M6 9c2 0 3 1 4 3M5 15h2M14 6v3"></path><g class="agent-gear"><circle cx="16" cy="16" r="3.5"></circle><circle cx="16" cy="16" r="1.1"></circle><path d="M16 10.5v2M16 19.5v2M10.5 16h2M19.5 16h2M12.1 12.1l1.4 1.4M18.5 18.5l1.4 1.4M12.1 19.9l1.4-1.4M18.5 13.5l1.4-1.4"></path></g></svg>';
              if (categoryIcon) {
                const icon = document.createElement("img");
                icon.src = categoryIcon.src;
                icon.alt = "";
                icon.width = 24;
                icon.height = 24;
                icon.draggable = false;
                agent.dataset.category = itemAgent.category;
                agent.replaceChildren(icon);
              }
              agentList.append(agent);
            }
            head.append(agentList);
          }

          content.append(head);

          if (item.status === "in_progress") {
            const progress = document.createElement("div");
            const measured = Number.isFinite(item.progress);
            progress.className = measured ? "progress" : "progress indeterminate";
            progress.setAttribute("role", "progressbar");
            progress.setAttribute("aria-label", measured ? "Прогресс шага" : "Работа идёт, процент неизвестен");
            if (measured) progress.setAttribute("aria-valuenow", String(item.progress));
            progress.dataset.stepId = item.id;
            progress.dataset.targetProgress = String(item.progress);
            const bar = document.createElement("span");
            if (measured) bar.style.width = `${previousProgress.get(item.id) ?? 0}%`;
            progress.append(bar);
            head.append(progress);
            activeProgressIds.add(item.id);
            previousProgress.set(item.id, item.progress);
          }

          if (item.note) {
            const note = document.createElement("div");
            note.className = "note";
            note.textContent = item.note;
            content.append(note);
          }

          li.append(status, content);
          steps.append(li);
        }

        for (const stepId of previousProgress.keys()) {
          if (!activeProgressIds.has(stepId)) previousProgress.delete(stepId);
        }
        alignProgressBars();
        requestAnimationFrame(() => {
          for (const progress of steps.querySelectorAll(".progress")) {
            const bar = progress.firstElementChild;
            if (bar && !progress.classList.contains("indeterminate")) bar.style.width = `${progress.dataset.targetProgress}%`;
          }
        });

        footer.textContent = plan.status === "completed"
          ? "Готово"
          : plan.status === "cancelled"
            ? "План отменён"
            : "Обновляется агентом";
        if (plan.status === "active" && goal) {
          if (goal.availability === "unavailable") footer.textContent = "Связь с goal недоступна";
          else if (goal.state === "detached") footer.textContent = "Связь с goal снята";
          else if (goal.state === "waiting") footer.textContent = "Ожидает привязки к goal";
          else footer.textContent = ({
            active: "Обновляется агентом",
            paused: "⏸ На паузе",
            blocked: "! Цель заблокирована",
            usage_limited: "⏸ Достигнут лимит использования",
            budget_limited: "⏸ Исчерпан бюджет цели",
            complete: "Цель завершена · в плане остались шаги",
          })[goal.status] ?? "Связь с goal недоступна";
        }
        shell.classList.add("ready");
        notifyHeight();
      }

      async function fetchLatestPlan() {
        if (!planId || typeof window.openai?.callTool !== "function") return;
        const value = await window.openai.callTool("get_task_plan", { plan_id: planId });
        return extractPlan(value);
      }

      async function refresh() {
        try {
          render(await fetchLatestPlan());
        } catch (error) {
          if (String(error?.message ?? error).includes("not found")) {
            footer.textContent = "План недоступен";
            notifyHeight();
          }
        }
      }

      function handleGlobals(event) {
        const globals = event?.detail?.globals;
        if (globals?.toolOutput) render(extractPlan(globals.toolOutput));
      }

      const initialPlan = extractPlan(initialOutput);
      planId = initialPlan?.id ?? window.openai?.toolInput?.plan_id ?? null;

      async function bootstrap() {
        try {
          const latestPlan = await fetchLatestPlan();
          if (latestPlan) {
            render(latestPlan);
            return;
          }
        } catch (error) {
          if (String(error?.message ?? error).includes("not found")) {
            footer.textContent = "План недоступен";
          }
        } finally {
          window.addEventListener("openai:set_globals", handleGlobals);
        }
        if (initialPlan) render(initialPlan);
        else {
          shell.classList.add("ready");
          footer.textContent ||= "План недоступен";
          notifyHeight();
        }
      }

      bootstrap();
      const cardResizeObserver = typeof ResizeObserver === "function" ? new ResizeObserver(notifyHeight) : null;
      cardResizeObserver?.observe(shell);
      document.fonts?.ready.then(notifyHeight);
      window.addEventListener("resize", () => {
        alignProgressBars();
        notifyHeight();
      });
      setInterval(refresh, 1800);
    </script>
  </body>
</html>

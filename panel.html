<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Task Plan</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #222224;
      --steps: #1f1f21;
      --border: #303032;
      --text: #b8b8ba;
      --title: #e2e2e5;
      --muted: #929296;
      --blue: #168bff;
      --green: #39c66a;
      --orange: #f0a132;
      --red: #ef6666;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html[data-retired="true"], html[data-retired="true"] body {
      height: 1px !important;
      min-height: 0 !important;
      overflow: hidden;
      background: transparent;
    }
    body { margin: 0; background: var(--surface); color: var(--text); font-size: 13px; line-height: 1.4; }
    .app { width: 100%; min-width: 0; }
    .header { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 14px 12px 13px; }
    .plan-icon { position: relative; display: flex; width: 28px; height: 32px; align-items: center; justify-content: center; }
    .emoji { display: block; font-size: 24px; line-height: 1; }
    .plan-check { position: absolute; width: 24px; height: 24px; color: var(--green); opacity: 0; pointer-events: none; }
    .plan-icon.completing .plan-check { animation: plan-check 1.2s ease-out forwards; }
    .plan-icon.completing .emoji { animation: plan-emoji 1.2s ease-out forwards; }
    h1 { margin: 0; color: var(--title); font-size: 16px; font-weight: 650; line-height: 1.28; letter-spacing: -.3px; overflow-wrap: anywhere; }
    .counter { color: #9d9da2; border: 1px solid var(--border); border-radius: 14px; background: #ffffff03; padding: 3px 8px; font-size: 10px; font-weight: 550; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .divider { height: 1px; margin: 0 12px; background: var(--border); }
    .steps { padding: 7px 12px 13px; background: var(--steps); }
    .step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 6px 0; }
    .step.pending { align-items: first baseline; }
    .status { display: flex; width: 28px; height: 21px; align-items: center; justify-content: center; padding-top: 2px; }
    svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .status svg { width: 19px; height: 19px; overflow: visible; }
    .status.completed { color: var(--green); }
    .status.in_progress { color: var(--blue); }
    .status.in_progress svg { animation: turn 7s linear infinite; }
    .status.waiting_for_user { color: var(--orange); }
    .status.waiting_for_user svg { animation: question-breathe 3.6s ease-in-out infinite; }
    .status.blocked { color: var(--red); }
    .status.skipped { color: #85858a; }
    .status.pending { height: 3px; align-items: baseline; gap: 3px; padding: 0; color: #68686e; }
    .dot { display: block; width: 3px; height: 3px; background: currentColor; border-radius: 50%; animation: dot-hop var(--dot-period, 4.6s) ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .12s; }
    .dot:nth-child(3) { animation-delay: .24s; }
    .status.just-completed svg { animation: check-arrive .4s ease-out; }
    .step-content { min-width: 0; }
    .step-head { position: relative; isolation: isolate; min-height: 21px; }
    .step-title { margin: 0; font-size: 13px; line-height: 1.5; font-weight: 400; overflow-wrap: anywhere; }
    .step.in_progress .step-title { font-weight: 600; }
    .step.completed .step-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
    .step.skipped .step-title { color: #929296; }
    .note { margin: 4px 0 0; color: #939398; font-size: 11.5px; line-height: 1.43; overflow-wrap: anywhere; }
    .agents { position: absolute; top: -5px; height: 30px; z-index: 1; border-radius: 7px; pointer-events: auto; }
    .agents.overlap { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); background: linear-gradient(90deg, transparent, var(--steps) 20%); }
    .agent { display: block; width: 30px; height: 30px; position: absolute; left: calc(var(--agent-index) * var(--agent-stride, 30px)); top: 0; }
    .agent img { display: block; width: 100%; height: 100%; object-fit: contain; filter: brightness(.97) saturate(.95); }
    .agent.working img { animation: agent-wave 3.8s ease-in-out infinite; animation-delay: var(--agent-delay, 0s); }
    .agent-fallback { display: flex; width: 26px; height: 26px; align-items: center; justify-content: center; border: 1px solid #38516b; border-radius: 50%; background: #26384b; color: #aec8e8; font-size: 11px; font-weight: 600; }
    .agent-check { position: absolute; width: 12px; height: 12px; right: -1px; bottom: -1px; color: var(--green); stroke-width: 2.2; filter: drop-shadow(0 1px 1px var(--steps)); animation: check-arrive .4s ease-out, check-rock 7s .6s ease-in-out infinite; }
    .progress { height: 3px; max-width: 100%; width: var(--title-width, 100%); margin-top: 5px; border-radius: 3px; background: #2b3040; overflow: hidden; }
    .progress-fill { position: relative; height: 100%; width: var(--progress, 100%); border-radius: inherit; background: #428dff; overflow: hidden; transition: width .35s ease; }
    .progress-fill::after { content: ""; position: absolute; inset: 0; width: 40px; background: linear-gradient(90deg, transparent, #c9dfffc4, transparent); animation: shimmer 2.5s ease-in-out infinite; }
    .progress.indeterminate .progress-fill { background: #428dff55; }
    .progress.indeterminate .progress-fill::after { width: 38%; background: linear-gradient(90deg, transparent, #559aff, transparent); }
    .empty { display: flex; min-height: 130px; padding: 22px 20px; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; }
    .app[data-execution-status="paused"] .status.in_progress svg,
    .app[data-execution-status="paused"] .agent img,
    .app[data-execution-status="paused"] .progress-fill::after,
    .app[data-execution-status="blocked"] .status.in_progress svg,
    .app[data-execution-status="blocked"] .agent img { animation-play-state: paused; }
    @media (max-width: 280px) { .header, .step { column-gap: 7px; } h1 { font-size: 15px; } .counter { padding-inline: 6px; } .step-title { font-size: 12.5px; } }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0%, 12% { left: 0; transform: translateX(-110%); } 75%, 100% { left: 100%; transform: translateX(10%); } }
    @keyframes dot-hop { 0%, 68%, 95%, 100% { transform: translateY(0); } 77% { transform: translateY(-2px); } 86% { transform: translateY(0); } }
    @keyframes question-breathe { 0%, 100% { opacity: .86; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-.6px) scale(1.025); } }
    @keyframes agent-wave { 0%, 100% { filter: brightness(.91) saturate(.95); transform: translateY(0); } 50% { filter: brightness(1.07) saturate(1.02); transform: translateY(-.8px); } }
    @keyframes check-arrive { 0% { transform: scale(.65); } 65% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes check-rock { 0%, 76%, 100% { transform: rotate(0); } 82% { transform: rotate(-8deg); } 88% { transform: rotate(6deg); } 94% { transform: rotate(0); } }
    @keyframes plan-check { 0% { opacity: 0; transform: scale(.7); } 15%, 55% { opacity: 1; } 80% { opacity: .8; transform: scale(1.3); } 100% { opacity: 0; transform: scale(1.45); } }
    @keyframes plan-emoji { 0%, 25% { filter: blur(3px); opacity: .4; } 100% { filter: none; opacity: 1; } }
  </style>
</head>
<body>
  <main id="app" class="app" aria-label="План текущего чата">
    <header id="header" class="header" hidden>
      <span id="planIcon" class="plan-icon" aria-hidden="true"><span id="emoji" class="emoji"></span></span>
      <h1 id="title"></h1>
      <span id="counter" class="counter" aria-live="polite"></span>
    </header>
    <div id="divider" class="divider" hidden></div>
    <section id="steps" class="steps" aria-label="Шаги плана" hidden></section>
    <div id="empty" class="empty" role="status">Загружаю план…</div>
  </main>
  <script type="module">/*__PANEL_BRIDGE__*/</script>
  <script type="module">
    const categoryIcons = /*__WORK_CATEGORY_ICONS__*/ {};
    const ns = 'http://www.w3.org/2000/svg';
    const $ = id => document.getElementById(id);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const rows = new Map();
    let bridge;
    let unsubscribe;
    let renderSequence = 0;
    let lastPlanId = null;
    let lastPlanStatus = null;
    let lastTitle = '';
    let renderedSignature = '';
    let resizeQueued = false;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = String(text);
      return node;
    }
    function svg(kind) {
      const shape = document.createElementNS(ns, 'svg');
      shape.setAttribute('viewBox', '0 0 24 24');
      shape.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS(ns, 'path');
      if (kind === 'completed') path.setAttribute('d', 'm5 12 4 5L19 5');
      else if (kind === 'waiting_for_user') path.setAttribute('d', 'M7 19H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-7l-5 3v-3ZM10 8a2 2 0 1 1 3 1.73c-.6.35-1 .77-1 1.77M12 14h.01');
      else if (kind === 'blocked') path.setAttribute('d', 'M12 8v5M12 16h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0');
      else if (kind === 'skipped') path.setAttribute('d', 'M7 12h10');
      else {
        const points = Array.from({ length: 32 }, (_, index) => {
          const angle = index * Math.PI / 16 - Math.PI / 16;
          const radius = index % 4 < 2 ? 7.4 : 9.5;
          return `${(12 + Math.cos(angle) * radius).toFixed(2)} ${(12 + Math.sin(angle) * radius).toFixed(2)}`;
        });
        path.setAttribute('d', 'M' + points.join('L') + 'Z');
      }
      shape.append(path);
      if (kind === 'in_progress') {
        const circle = document.createElementNS(ns, 'circle');
        circle.setAttribute('cx', '12'); circle.setAttribute('cy', '12'); circle.setAttribute('r', '3');
        shape.append(circle);
      }
      return shape;
    }
    function animateText(node) {
      if (!reducedMotion.matches && node.animate) node.animate([
        { opacity: .25, filter: 'blur(2px)', transform: 'translateY(2px)' },
        { opacity: 1, filter: 'none', transform: 'translateY(0)' },
      ], { duration: 230, easing: 'ease-out' });
    }
    function measureRow(row) {
      const available = row.head.clientWidth;
      if (!available) return;
      const titleWidth = Math.min(available, row.measure.getBoundingClientRect().width);
      if (row.progress) row.progress.style.setProperty('--title-width', `${Math.max(0, titleWidth)}px`);
      if (!row.agents) return;
      const count = row.agents.childElementCount;
      const naturalWidth = count * 30;
      const fits = titleWidth + 6 + naturalWidth <= available;
      const width = fits ? naturalWidth : Math.min(available, 30 + Math.max(0, count - 1) * 13);
      const stride = fits ? 30 : count > 1 ? Math.max(0, (width - 30) / (count - 1)) : 0;
      row.agents.classList.toggle('overlap', !fits);
      row.agents.style.width = `${width}px`;
      row.agents.style.setProperty('--agent-stride', `${stride}px`);
      row.agents.style.left = fits ? `${titleWidth + 6}px` : 'auto';
      row.agents.style.right = fits ? 'auto' : '0';
    }
    function queueMeasure() {
      if (resizeQueued) return;
      resizeQueued = true;
      requestAnimationFrame(() => { resizeQueued = false; for (const row of rows.values()) measureRow(row); });
    }
    const observer = typeof ResizeObserver === 'function' ? new ResizeObserver(queueMeasure) : null;
    function makeRow(key) {
      const node = el('article', 'step');
      const marker = el('span', 'status');
      const content = el('div', 'step-content');
      const head = el('div', 'step-head');
      const title = el('p', 'step-title');
      const measure = el('span', 'title-measure');
      title.append(measure); head.append(title); content.append(head); node.append(marker, content);
      const row = { node, marker, content, head, title, measure, key, status: null, titleText: null,
        note: null, noteText: null, agents: null, agentSignature: '', progress: null, progressFill: null };
      observer?.observe(head);
      return row;
    }
    function updateRow(row, step) {
      const statuses = ['completed', 'in_progress', 'pending', 'waiting_for_user', 'blocked', 'skipped'];
      const status = statuses.includes(step.status) ? step.status : 'pending';
      row.node.className = `step ${status}`;
      if (status !== row.status) {
        row.marker.className = `status ${status}`;
        row.marker.setAttribute('aria-label', ({ completed: 'Завершён', in_progress: 'В процессе', pending: 'Ожидает', waiting_for_user: 'Нужен ответ', blocked: 'Заблокирован', skipped: 'Пропущен' })[status]);
        row.marker.replaceChildren();
        if (status === 'pending') {
          let seed = 0;
          for (const char of row.key) seed = (seed * 31 + char.charCodeAt(0)) >>> 0;
          row.marker.style.setProperty('--dot-period', `${3.5 + seed % 2200 / 1000}s`);
          for (let index = 0; index < 3; index++) row.marker.append(el('i', 'dot'));
        } else row.marker.append(svg(status));
        if (status === 'completed' && row.status !== null) row.marker.classList.add('just-completed');
        row.status = status;
      }
      const titleText = String(step.title ?? '');
      if (titleText !== row.titleText) { row.measure.textContent = titleText; row.titleText = titleText; }
      const noteText = typeof step.note === 'string' ? step.note : '';
      if (noteText !== row.noteText) {
        if (!noteText) { row.note?.remove(); row.note = null; }
        else {
          if (!row.note) { row.note = el('p', 'note'); row.content.append(row.note); }
          row.note.textContent = noteText;
          animateText(row.note);
        }
        row.noteText = noteText;
      }
      if (status === 'in_progress') {
        if (!row.progress) {
          row.progress = el('div', 'progress'); row.progressFill = el('div', 'progress-fill');
          row.progress.append(row.progressFill);
          row.content.insertBefore(row.progress, row.note);
          row.progress.setAttribute('role', 'progressbar');
          row.progress.setAttribute('aria-label', 'Прогресс шага');
          row.progress.setAttribute('aria-valuemin', '0'); row.progress.setAttribute('aria-valuemax', '100');
        }
        const measured = typeof step.progress === 'number' && Number.isFinite(step.progress);
        row.progress.classList.toggle('indeterminate', !measured);
        row.progressFill.style.setProperty('--progress', measured ? `${Math.max(0, Math.min(100, step.progress))}%` : '100%');
        if (measured) row.progress.setAttribute('aria-valuenow', String(Math.max(0, Math.min(100, step.progress))));
        else row.progress.removeAttribute('aria-valuenow');
      } else { row.progress?.remove(); row.progress = null; row.progressFill = null; }
      const agents = Array.isArray(step.agents) ? step.agents : [];
      const agentSignature = JSON.stringify(agents);
      if (agentSignature !== row.agentSignature) {
        row.agents?.remove(); row.agents = null;
        if (agents.length) {
          row.agents = el('div', 'agents'); row.agents.setAttribute('aria-label', 'Субагенты');
          for (const [index, agent] of agents.entries()) {
            const complete = agent.status === 'completed';
            const item = el('span', `agent ${complete ? 'completed' : 'working'}`);
            item.style.setProperty('--agent-index', String(index));
            item.style.setProperty('--agent-delay', `${-index * .77}s`);
            item.title = `${agent.name ?? ''} · ${complete ? 'готово' : 'работает'}`;
            const artwork = Object.hasOwn(categoryIcons, agent.category) ? categoryIcons[agent.category] : null;
            if (typeof artwork?.src === 'string' && artwork.src.startsWith('data:image/')) {
              const image = document.createElement('img'); image.src = artwork.src; image.alt = String(agent.name ?? artwork.label ?? 'Субагент'); item.append(image);
            } else item.append(el('span', 'agent-fallback', String(agent.name ?? '·').slice(0, 1).toUpperCase()));
            if (complete) { const check = svg('completed'); check.classList.add('agent-check'); item.append(check); }
            row.agents.append(item);
          }
          row.head.append(row.agents);
        }
        row.agentSignature = agentSignature;
      }
    }
    function clearRows() {
      for (const row of rows.values()) observer?.unobserve(row.head);
      rows.clear(); $('steps').replaceChildren();
    }
    function render(payload) {
      if (!payload || payload.panel !== true) return;
      $('app').hidden = payload.retired === true;
      document.documentElement.dataset.retired = String(payload.retired === true);
      const signature = JSON.stringify({ thread_id: payload.thread_id, plan: payload.plan, message: payload.message ?? '' });
      if (signature === renderedSignature) return;
      renderedSignature = signature;
      const sequence = ++renderSequence;
      const plan = payload.thread_id && payload.plan ? payload.plan : null;
      $('header').hidden = !plan; $('divider').hidden = !plan; $('steps').hidden = !plan; $('empty').hidden = Boolean(plan);
      if (!plan) {
        clearRows(); $('title').textContent = ''; $('emoji').textContent = ''; $('counter').textContent = '';
        $('planIcon').classList.remove('completing'); $('planIcon').querySelector('.plan-check')?.remove();
        $('empty').textContent = typeof payload.message === 'string' && payload.message ? payload.message : 'В этом чате пока нет плана';
        delete $('app').dataset.planId; delete $('app').dataset.revision; delete $('app').dataset.executionStatus;
        lastPlanId = null; lastPlanStatus = null; lastTitle = '';
      } else {
        const changedPlan = lastPlanId !== plan.id;
        const completeNow = !changedPlan && lastPlanStatus !== 'completed' && plan.status === 'completed';
        if (changedPlan) clearRows();
        const title = String(plan.title ?? '');
        if (title !== lastTitle) { $('title').textContent = title; if (lastPlanId) animateText($('title')); lastTitle = title; }
        $('emoji').textContent = typeof plan.emoji === 'string' ? plan.emoji : '☷';
        if (changedPlan || completeNow) {
          $('planIcon').classList.toggle('completing', completeNow);
          $('planIcon').querySelector('.plan-check')?.remove();
          if (completeNow) { const check = svg('completed'); check.classList.add('plan-check'); $('planIcon').append(check); }
        }
        const finished = Number.isInteger(plan.finished) ? plan.finished : plan.steps.filter(step => ['completed', 'skipped'].includes(step.status)).length;
        const total = Number.isInteger(plan.total) ? plan.total : plan.steps.length;
        $('counter').textContent = `${finished} из ${total}`;
        $('counter').setAttribute('aria-label', `Завершено ${finished} из ${total} шагов`);
        $('app').dataset.planId = plan.id; $('app').dataset.revision = String(plan.revision);
        $('app').dataset.executionStatus = String(plan.goal?.status ?? 'active');
        const liveKeys = new Set();
        for (const [index, step] of plan.steps.entries()) {
          const key = typeof step.id === 'string' ? step.id : String(index);
          liveKeys.add(key);
          let row = rows.get(key);
          if (!row) { row = makeRow(key); rows.set(key, row); }
          updateRow(row, step);
          const expected = $('steps').children[index];
          if (expected !== row.node) $('steps').insertBefore(row.node, expected ?? null);
        }
        for (const [key, row] of rows) if (!liveKeys.has(key)) { observer?.unobserve(row.head); row.node.remove(); rows.delete(key); }
        lastPlanId = plan.id; lastPlanStatus = plan.status;
        queueMeasure();
      }
      document.documentElement.dataset.panelRendered = plan ? 'plan' : 'empty';
      requestAnimationFrame(() => {
        if (sequence !== renderSequence) return;
        const receipt = { counter: $('counter').textContent };
        if (plan) { receipt.plan_id = plan.id; receipt.revision = plan.revision; }
        bridge?.rendered?.(receipt);
      });
    }
    function connect() {
      if (!window.taskPlanPanel || bridge === window.taskPlanPanel) return;
      unsubscribe?.(); bridge = window.taskPlanPanel;
      unsubscribe = bridge.onState(render);
    }
    window.addEventListener('task-plan-panel-ready', connect);
    window.addEventListener('resize', queueMeasure);
    window.addEventListener('pagehide', () => { unsubscribe?.(); observer?.disconnect(); }, { once: true });
    connect();
  </script>
</body>
</html>
